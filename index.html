    }

})();
(function(){
  var P = 'AB::';
  var SP = Storage.prototype;
  var g = SP.getItem, st = SP.setItem, rm = SP.removeItem, k0 = SP.key;
  var lenDesc = Object.getOwnPropertyDescriptor(SP, 'length');
  function rawKeys(store){ var out = [], n = lenDesc.get.call(store); for(var i = 0; i < n; i++){ out.push(k0.call(store, i)); } return out; }
  function mine(store){ return rawKeys(store).filter(function(k){ return k && k.indexOf(P) === 0; }).map(function(k){ return k.slice(P.length); }); }
  SP.getItem = function(k){ return g.call(this, P + k); };

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آڑھت بک</title>
<meta name="theme-color" content="#7f1d1d">
<meta name="description" content="آڑھت بک — آڑھتی کا حساب: زمیندار، گاڑی، بکری، پرچی، خریدار کا کھاتہ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آڑھت بک">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face{font-family:'Noori'; src:url('fonts/JameelNooriNastaleeq-Regular.woff2') format('woff2'); font-display:swap;}
@font-face{font-family:'NooriKasheeda'; src:url('fonts/JameelNooriNastaleeq-Kasheeda.woff2') format('woff2'); font-display:swap;}
:root{
  /* 🎨 رنگ کا تھیم — ایک جگہ سے پوری ایپ (سرخ بنیادی؛ نیلا، سبز، کالا، سلیٹی، سادہ سفید بھی) */
  --c1:#dc2626; --c2:#b91c1c; --c3:#991b1b; --c4:#7f1d1d; --c5:#450a0a;
  --l0:#fff5f5; --l1:#fee2e2; --l2:#fecaca; --l3:#fca5a5;
  --pageBg:radial-gradient(circle at 20% 0%,var(--c1) 0%,var(--c3) 38%,var(--c4) 70%,var(--c5) 100%);
  --barBg:linear-gradient(180deg,var(--c5),var(--c4)); --onBar:#fff; --onBg:#fff; --onBgMuted:rgba(255,255,255,.82);
  --red:var(--c2); --red2:var(--c3); --red3:var(--c4); --red4:var(--c5); --redL:var(--l1); --redL2:var(--l2); --redL3:var(--l0);
  --ttlTx:#fde68a;
  --gold:#fbbf24; --ink:#1c1917; --muted:#78716c; --card:#ffffff; --good:#15803d; --bad:#b91c1c;
  /* 📅 تاریخ کا ویل — ریڈیم رنگ (ہر تھیم میں ایک جیسا) */
  --rad:#39ff14; --radTx:#eaffe4; --radDim:#8fc9a2; --radSoft:rgba(57,255,20,.6); --radBg1:#12324a; --radBg2:#06111a; --radCol:#10283a; --radBd:#1f6f5c;
}
html[data-theme="blue"]{--c1:#2563eb; --c2:#1d4ed8; --c3:#1e40af; --c4:#1e3a8a; --c5:#172554; --l0:#eff6ff; --l1:#dbeafe; --l2:#bfdbfe; --l3:#93c5fd;}
html[data-theme="green"]{--c1:#16a34a; --c2:#15803d; --c3:#166534; --c4:#14532d; --c5:#052e16; --l0:#f0fdf4; --l1:#dcfce7; --l2:#bbf7d0; --l3:#86efac;}
html[data-theme="black"]{--c1:#404040; --c2:#262626; --c3:#1f1f1f; --c4:#171717; --c5:#0a0a0a; --l0:#f5f5f5; --l1:#e5e5e5; --l2:#d4d4d4; --l3:#a3a3a3;}
html[data-theme="gray"]{--c1:#64748b; --c2:#475569; --c3:#3f4c5e; --c4:#334155; --c5:#1e293b; --l0:#f8fafc; --l1:#e2e8f0; --l2:#cbd5e1; --l3:#94a3b8;}
html[data-theme="white"]{--c1:#57534e; --c2:#44403c; --c3:#3a3633; --c4:#292524; --c5:#1c1917; --l0:#fafaf9; --l1:#f5f5f4; --l2:#e7e5e4; --l3:#d6d3d1;
  --pageBg:#f5f5f4; --barBg:#ffffff; --onBar:#1c1917; --onBg:#1c1917; --onBgMuted:#57534e; --ttlTx:#7f1d1d;}
html[data-theme="white"] #topbar .ttl{text-shadow:none;}
html[data-theme="white"] #topbar .ib{background:#f5f5f4; border-color:#d6d3d1; color:#1c1917;}
html[data-theme="white"] #verBadge{background:#f5f5f4; color:#44403c; border-color:#d6d3d1;}
html[data-theme="white"] .card,html[data-theme="white"] .stat,html[data-theme="white"] .tile{border:1px solid #e7e5e4;}
/* ---------- رنگ چننے کے بٹن ---------- */
.themes{display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin:4px 0 10px;}
.themes .tl{color:var(--onBg); font-size:15px;}
.themes button{width:34px; height:34px; border-radius:50%; border:3px solid rgba(255,255,255,.85); box-shadow:0 2px 6px rgba(0,0,0,.35); padding:0;}
.themes button.on{outline:3px solid var(--gold); outline-offset:2px;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{font-family:'Noori','Noto Nastaliq Urdu',serif; color:var(--ink); background:var(--pageBg) fixed; direction:rtl; text-align:right; font-size:18px; line-height:1.9;}
.num,input[inputmode],input[type=date],.v{font-family:Tahoma,Arial,sans-serif !important;}
button{font:inherit; cursor:pointer;}
input,select,textarea{font:inherit;}

/* ---------- اوپر کی پٹی ---------- */
#topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px; padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top)); background:var(--barBg); color:var(--onBar); box-shadow:0 3px 12px rgba(0,0,0,.35); border-bottom:3px solid var(--gold);}
/* دکان کا نام: صاف، روشن رنگ، کبھی کٹا ہوا نہیں — لمبا ہو تو خود چھوٹا (fitTitle)؛ فون پر اپنی الگ پوری قطار میں */
#topbar .ttl{flex:1; min-width:0; font-family:'NooriKasheeda',Arial,'Noori',sans-serif; font-size:24px; font-weight:bold; white-space:nowrap; overflow:hidden; line-height:1.8; color:var(--ttlTx); text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.45); letter-spacing:.2px;}
#topbar .ttl.two{white-space:normal; line-height:1.35; padding:2px 0;}
@media (max-width:620px){
  #topbar{flex-wrap:wrap; row-gap:2px;}
  #topbar .ttl{order:9; flex:1 1 100%; text-align:center; line-height:1.55; padding-bottom:2px;}
}
#topbar .ib{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:12px; width:44px; height:40px; font-size:20px; display:inline-flex; align-items:center; justify-content:center;}
#verBadge{background:rgba(0,0,0,.25); border:1px solid rgba(251,191,36,.6); color:#fde68a; border-radius:10px; padding:0 8px; font:12px/2 Tahoma,Arial,sans-serif; cursor:pointer; user-select:none;}

/* ---------- ڈھانچہ: فون پر دراز، کروم بک پر دائیں مستقل پٹی ---------- */
#layout{display:flex; min-height:calc(100vh - 56px);}
#side{position:fixed; top:0; bottom:0; right:0; width:270px; max-width:84vw; z-index:60; background:linear-gradient(180deg,var(--c5),var(--c4) 60%,var(--c3)); color:#fff; transform:translateX(105%); transition:transform .22s; overflow-y:auto; padding:12px 10px 30px; box-shadow:-6px 0 20px rgba(0,0,0,.4);}
#side.open{transform:none;}
#sideShade{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:55; display:none;}
#sideShade.open{display:block;}
#side .brand{font-family:'NooriKasheeda',serif; font-size:28px; text-align:center; color:#fde68a; margin:4px 0 10px;}
#side .who{color:#fde68a; text-align:center; margin:-4px 0 8px; font-size:17px;}
#side .nav{display:flex; align-items:center; gap:10px; width:100%; border:none; background:rgba(255,255,255,.08); color:#fff; border-radius:12px; padding:4px 12px; margin-bottom:6px; font-size:19px; text-align:right;}
#side .nav.on{background:#fff; color:var(--red3); box-shadow:0 3px 0 var(--gold);}
#side .nav .e{font-size:20px; width:26px; text-align:center;}
#main{flex:1; min-width:0; padding:10px 10px 90px;}
@media (min-width:900px){
  #side{position:sticky; top:56px; height:calc(100vh - 56px); transform:none; box-shadow:none; width:250px; flex:0 0 250px;}
  #sideShade,#menuBtn{display:none !important;}
  #main{padding:16px 22px 40px;}
}
.wrap{max-width:1280px; margin:0 auto;}

/* ---------- کارڈ، خانے، بٹن ---------- */
.card{background:var(--card); border-radius:16px; padding:12px; margin-bottom:12px; box-shadow:0 6px 18px rgba(0,0,0,.22); border-top:4px solid var(--red);}
.card h3{margin:0 0 6px; color:var(--red3); font-size:21px; line-height:1.9; font-weight:normal;}
.card.plain{border-top:none;}
.pageTitle{color:var(--onBg); font-family:'NooriKasheeda','Noori',serif; font-size:30px; margin:2px 4px 8px; text-shadow:0 2px 6px rgba(0,0,0,.4); line-height:1.8; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.pageTitle .sp{flex:1;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
.f label{display:block; font-size:15px; color:#57534e; line-height:1.8;}
.f input,.f select,.f textarea{width:100%; border:1.6px solid var(--l3); border-radius:11px; padding:6px 9px; font-size:18px; line-height:1.7; background:#fff; color:var(--ink); min-height:44px;}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--c1); border-color:var(--c1);}
.f input[inputmode],.f input[type=date]{direction:ltr; text-align:right;}
.btn{border:none; border-radius:12px; padding:6px 16px; font-size:19px; line-height:1.9; background:linear-gradient(180deg,var(--c1),var(--c2)); color:#fff; box-shadow:0 3px 0 var(--c4); min-height:44px;}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--c4);}
.btn.light{background:var(--l0); color:var(--red3); box-shadow:0 3px 0 var(--l2); border:1.5px solid var(--l2);}
.btn.gray{background:#f5f5f4; color:#44403c; box-shadow:0 3px 0 #d6d3d1;}
.btn.gold{background:linear-gradient(180deg,#fcd34d,#f59e0b); color:#451a03; box-shadow:0 3px 0 #b45309;}
.btn.sm{font-size:15px; padding:2px 10px; min-height:36px;}
.btn.wide{width:100%;}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.muted{color:var(--muted); font-size:15px;}
.warn{background:var(--l1); border:1.5px solid var(--c1); color:var(--c3); border-radius:10px; padding:6px 10px; margin:6px 0;}
.ok{background:#f0fdf4; border:1.5px solid #22c55e; color:#166534; border-radius:10px; padding:6px 10px; margin:6px 0;}

/* ---------- ہوم ---------- */
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:12px;}
.stat{background:rgba(255,255,255,.96); border-radius:14px; padding:6px 10px; box-shadow:0 4px 12px rgba(0,0,0,.2); border-right:5px solid var(--red);}
.stat .l{font-size:15px; color:#57534e;}
.stat .n{font-family:Tahoma,Arial,sans-serif; font-size:21px; color:var(--red3); direction:ltr; text-align:right; line-height:1.6;}
.cashSum{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
.cashSum>div{background:var(--l0); border:1.5px solid var(--l2); border-radius:11px; padding:4px 8px; text-align:center;}
.cashSum .l{display:block; font-size:14px; color:#57534e;} .cashSum b{font-size:19px; color:var(--red3);}
.cashSum .hot{background:var(--l1); border-color:var(--l3);}
.f input.jam{border-color:#16a34a; background:#f0fdf4;} .f input.banam{border-color:#dc2626; background:#fef2f2;}
.list .it.on{outline:2.5px solid var(--red); background:var(--l0);}
@media (max-width:520px){ .cashSum{grid-template-columns:repeat(2,1fr);} }
.stat.g{border-right-color:#15803d;} .stat.g .n{color:#166534;}
.stat.y{border-right-color:#f59e0b;} .stat.y .n{color:#92400e;}
.tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
.tile{background:#fff; border:none; border-radius:18px; padding:12px 4px 6px; box-shadow:0 5px 14px rgba(0,0,0,.25); display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--red3); font-size:17px; line-height:1.8;}
.tile .e{font-size:34px; width:62px; height:62px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--l1),var(--l2)); box-shadow:inset 0 -3px 0 rgba(127,29,29,.15);}
.tile.big{grid-column:span 3; flex-direction:row; justify-content:center; gap:12px; font-size:24px; background:linear-gradient(180deg,#fcd34d,#f59e0b); color:#451a03;}
.tile.big .e{background:rgba(255,255,255,.5); width:54px; height:54px;}
@media (min-width:700px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr));}
  .tile.big{grid-column:span 5;}
  .grid2.wideable{grid-template-columns:repeat(4,minmax(0,1fr));}
}

/* ---------- جدول اور فہرستیں ---------- */
.t{width:100%; border-collapse:collapse; font-size:17px;}
.t td,.t th{padding:3px 6px; border-bottom:1px solid var(--l1); line-height:1.8; vertical-align:middle;}
.t th{color:var(--red3); font-weight:normal; background:var(--l0);}
.t td.v,.t th.v{text-align:left; direction:ltr; font-size:15px; white-space:nowrap;}
.t tr.tot td{font-size:19px; color:var(--red3); border-top:2px solid var(--red); border-bottom:none;}
.t tr.net td{font-size:21px; background:var(--red); color:#fff;}
.t .tag{font-size:12px; border-radius:8px; padding:0 6px; margin-right:4px; font-family:'Noori',serif;}
.t .tag.in{background:#dcfce7; color:#166534;} .t .tag.out{background:#f5f5f4; color:#57534e;}
.tblWrap{overflow-x:auto;}
.list .it{display:flex; justify-content:space-between; gap:8px; align-items:center; border-bottom:1px solid var(--l1); padding:6px 4px; cursor:pointer; border-radius:8px;}
.list .it:hover{background:var(--l0);}
.list .it .a{font-family:Tahoma,Arial,sans-serif; direction:ltr; white-space:nowrap; font-size:16px;}
.amt-in{color:#166534;} .amt-out{color:var(--c2);}

/* ---------- پرچی ---------- */
.line{border:1.6px dashed var(--l3); border-radius:12px; padding:10px 8px 6px; margin:12px 0 8px; background:var(--l0); position:relative;}
.line .no{position:absolute; top:-12px; right:10px; background:var(--red); color:#fff; border-radius:10px; padding:0 9px; font-size:13px; line-height:1.8;}
.lineGrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px;}
.lineAmt{font-size:16px; color:var(--red3);}
.lx{margin-top:4px;} .lx summary{cursor:pointer; color:var(--c3); font-size:14px; padding:2px 0;} .lx[open] summary{margin-bottom:4px;}
.pnoTag{display:inline-block; min-width:22px; padding:0 6px; border-radius:9px; background:var(--c3); color:var(--l0); font-size:13px; text-align:center; line-height:20px;}
.parchiWrap{display:block;}
@media (min-width:1000px){
  .parchiWrap{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:14px; align-items:start;}
  .parchiWrap .sticky{position:sticky; top:66px;}
  .lineGrid{grid-template-columns:2fr 1fr 1fr 1fr 1fr 2fr;}
  .lx .lineGrid{grid-template-columns:repeat(3,minmax(0,1fr));}
}
.chg{display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center; border-bottom:1px solid var(--l1); padding:6px 0;}
.chg .n{font-size:18px;} .chg .d{font-size:14px; color:var(--muted);}
.chg.off .n{color:#a8a29e; text-decoration:line-through;}
.seg{display:flex; background:var(--l0); border-radius:12px; padding:3px; gap:3px; margin-bottom:10px;}
.seg button{flex:1; border:none; background:transparent; color:var(--red3); border-radius:10px; padding:4px 6px; font-size:18px; min-height:42px;}
.seg button.on{background:var(--red); color:#fff;}

/* ---------- پیغام اور اپڈیٹ کارڈ ---------- */
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(30px); background:var(--c5); color:#fff; padding:6px 18px; border-radius:22px; font-size:18px; line-height:1.9; opacity:0; transition:.25s; z-index:9999; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.4); border:1px solid var(--gold); max-width:92vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#modal{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9000; display:none; align-items:center; justify-content:center; padding:16px;}
#modal.open{display:flex;}
/* ---------- 📅 تاریخ کا ویل (datewheel.js) ---------- */
.dwBox{display:flex; align-items:center; gap:8px; border-radius:14px; padding:3px 8px; background:radial-gradient(120% 120% at 50% 0%,var(--radBg1),var(--radBg2)); border:1.5px solid var(--radBd); box-shadow:inset 0 0 12px rgba(57,255,20,.08); direction:rtl; min-height:66px; flex-wrap:wrap; justify-content:center; max-width:100%;}
.dwShow{flex:1 1 90px; min-width:0; text-align:center; line-height:1.15;}
.dwDay{font-family:'NooriKasheeda','Noori',serif; font-size:22px; line-height:1.45; white-space:nowrap; color:var(--radTx); text-shadow:0 0 6px var(--rad),0 0 14px var(--radSoft);}
.dwFull{color:var(--radDim); font-size:14px; line-height:1.5;}
.dwFull .n{white-space:nowrap;}
.dwFull .n{font-family:Arial,sans-serif; font-weight:900; direction:ltr; unicode-bidi:isolate; margin:0 4px; color:var(--radTx);}
.dwHint{font-size:12px; color:var(--radDim);}
.dwTag{display:inline-block; margin-inline-start:6px; padding:0 7px; border-radius:9px; font-size:11px; line-height:1.7; background:var(--gold); color:var(--ink);}
.dwTag.old{background:var(--radBd); color:var(--radTx);}

  + '.aupd-wait .aw-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(-45deg,#fde68a 0 10px,#f59e0b 10px 20px);background-size:28px 28px;animation:aupdMove .7s linear infinite}'
  + '.aupd-glass{width:22px;height:30px;flex:0 0 auto;animation:aupdFlip 2.4s ease-in-out infinite}'
  + '.aupd-glass .sa{animation:aupdTop 2.4s linear infinite;transform-origin:50% 100%}.aupd-glass .sb{animation:aupdBot 2.4s linear infinite;transform-origin:50% 100%}'
  + '.aupd-glass .st{animation:aupdStream 2.4s linear infinite}'
  + '.aupd-ov{position:fixed;inset:0;z-index:2147483647;background:rgba(8,20,40,.55);display:none;align-items:center;justify-content:center;padding:16px}'
  + '.aupd-ov.show{display:flex}'
  + '.aupd-card{width:min(340px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.4);animation:aupdPop .45s cubic-bezier(.2,1.4,.4,1);font-family:inherit;text-align:center}'
  + '.aupd-card .ah{background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:14px 12px 12px;font-size:18px;font-weight:800;line-height:1.5}'
  + '.aupd-card .ab{padding:12px 16px 4px}'
  + '.aupd-card .av{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e5e7eb;border-radius:12px;padding:7px 12px;margin:6px 0;font-size:13px;color:#374151}'
  + '.aupd-card .av b{direction:ltr;unicode-bidi:isolate;font-family:Arial,sans-serif;font-size:14.5px;letter-spacing:.4px}'
  + '.aupd-card .av.o b{color:#9ca3af;text-decoration:line-through}.aupd-card .av.n{border-color:#34d399;background:#ecfdf5}.aupd-card .av.n b{color:#047857}'
  + '.aupd-card .aa{color:#10b981;font-size:16px;line-height:1}'
  + '.aupd-card .anote{margin:10px 0 4px;padding:8px 12px;border-radius:12px;background:#fffbeb;border:1px solid #fcd34d;color:#78350f;font-size:13.5px;font-weight:700;line-height:1.7;'
  +   'white-space:normal;overflow-wrap:anywhere;max-height:40vh;overflow-y:auto}'
  + '.aupd-card .af{padding:10px 16px 16px;display:flex;justify-content:center}'
  + '.aupd-card .aok{min-width:140px;height:44px;border:none;border-radius:14px;background:linear-gradient(135deg,#0d3b66,#0f766e);color:#fff;font-size:17px;font-weight:800;font-family:inherit;box-shadow:0 5px 0 #0a2c4d;cursor:pointer}'
  + '.aupd-card .aok:active{transform:translateY(3px);box-shadow:0 2px 0 #0a2c4d}'
  + '@keyframes aupdDrop{from{transform:translate(-50%,-120%)}to{transform:translate(-50%,0)}}'
  + '@keyframes aupdPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}'
  + '@keyframes aupdMove{to{background-position:28px 0}}'
  + '@keyframes aupdFlip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}'
  + '@keyframes aupdTop{0%{transform:scaleY(1)}80%,100%{transform:scaleY(0)}}'
  + '@keyframes aupdBot{0%{transform:scaleY(0)}80%,100%{transform:scaleY(1)}}'
  + '@keyframes aupdStream{0%,78%{opacity:1}80%,100%{opacity:0}}';
  var GLASS = '<svg class="aupd-glass" viewBox="0 0 22 30" aria-hidden="true">'
    + '<rect x="2" y="1" width="18" height="2.5" rx="1.2" fill="#fde68a"/><rect x="2" y="26.5" width="18" height="2.5" rx="1.2" fill="#fde68a"/>'
    + '<path d="M4 3.5h14c0 5-4 7.5-6 11.5 2 4 6 6.5 6 11.5H4c0-5 4-7.5 6-11.5-2-4-6-6.5-6-11.5z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="1.3"/>'
    + '<path class="sa" d="M6.5 6h9c-.6 2.6-2.8 4.4-4.5 7-1.7-2.6-3.9-4.4-4.5-7z" fill="#fbbf24"/>'
    + '<rect class="st" x="10.4" y="13" width="1.2" height="10" fill="#fbbf24"/>'
    + '<path class="sb" d="M5.6 25.5h10.8c-.4-2.4-2.6-4.3-5.4-5.6-2.8 1.3-5 3.2-5.4 5.6z" fill="#fbbf24"/></svg>';
  function css(){ if(document.getElementById('aupdCss')) return; var s=document.createElement('style'); s.id='aupdCss'; s.textContent=CSS; document.head.appendChild(s); }
  function el(id, cls, html){ var e=document.getElementById(id); if(!e){ e=document.createElement('div'); e.id=id; e.className=cls; if(html) e.innerHTML=html; document.body.appendChild(e); } return e; }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var dir = L==='en' ? 'ltr' : 'rtl';
  window.AppUpd = {
    lang: L,
    waiting: function(sub, passive){
      css();
      var sh = el('aupdShield','aupd-shield');
      var w = el('aupdWait','aupd-wait', GLASS + '<div><div class="aw-t"></div><div class="aw-s"></div></div><div class="aw-bar"></div>');
      w.setAttribute('dir', dir); w.setAttribute('role','status');
      w.querySelector('.aw-t').textContent = T.wait;
      w.querySelector('.aw-s').textContent = sub || T.waitSub;
      sh.classList.add('show'); sh.classList.toggle('passive', !!passive); w.classList.add('show');
    },
    hideWaiting: function(){
      var w=document.getElementById('aupdWait'), sh=document.getElementById('aupdShield');
      if(w) w.classList.remove('show'); if(sh) sh.classList.remove('show','passive');
    },
    isWaiting: function(){ var w=document.getElementById('aupdWait'); return !!(w && w.classList.contains('show')); },
    done: function(oldV, newV, note){
      css(); this.hideWaiting();
      var ov = el('aupdDone','aupd-ov');
      ov.setAttribute('dir', dir);
      ov.innerHTML = '<div class="aupd-card" role="dialog" aria-modal="true">'
        + '<div class="ah">✅ ' + esc(T.done) + '</div><div class="ab">'
        + (oldV ? '<div class="av o"><span>' + esc(T.oldV) + '</span><b>' + esc(oldV) + '</b></div><div class="aa">⬇</div>' : '')
        + '<div class="av n"><span>' + esc(T.newV) + '</span><b>' + esc(newV) + '</b></div>'
        + (note ? '<div class="anote">🛠️ ' + esc(note) + '</div>' : '')
        + '</div><div class="af"><button type="button" class="aok">' + esc(T.ok) + '</button></div></div>';
      ov.querySelector('.aok').onclick = function(){ ov.classList.remove('show'); };
      ov.classList.add('show');
    },
    hideDone: function(){ var ov=document.getElementById('aupdDone'); if(ov) ov.classList.remove('show'); }
  };
})();
</script>
