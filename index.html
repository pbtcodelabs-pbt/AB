<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* 📒 آڑھت بک — حفاظتی حصہ (ہر چیز سے پہلے چلتا ہے)
   1) غلط جگہ پہرہ: یہ فائل سبزی منڈی (/SM/) یا فروٹ منڈی (/FM/) کی جگہ لگ جائے تو کچھ نہ پڑھے، کچھ نہ لکھے
   2) فون کا سارا ڈیٹا "AB::" کے الگ خانے میں — اسی ویب سائٹ کی دوسری ایپس سے کبھی نہ ملے */
var __APP_KIND = 'AB';
(function(){
  try{
    var h = location.hostname.toLowerCase(), p = location.pathname;
    if(/\.github\.io$/.test(h) && /^\/(SM|FM)(\/|$)/i.test(p)){
      window.__APP_WRONG_REPO = true;
      document.write('<div dir="rtl" style="position:fixed;inset:0;z-index:2147483647;background:#7f1d1d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font:700 20px/2 Tahoma,Arial,sans-serif;"><div style="font-size:54px;">⛔</div><div>غلط فائل اپلوڈ ہو گئی ہے</div><div>یہ آڑھت بک کی فائل ہے، یہاں نہیں لگنی چاہیے۔</div><div style="font-size:15px;">آپ کا ڈیٹا محفوظ ہے — اس فائل نے کچھ نہیں پڑھا، کچھ نہیں بدلا۔</div></div><plaintext style="display:none">');
    }
  }catch(e){}
})();
(function(){
  var P = 'AB::';
  var SP = Storage.prototype;
  var g = SP.getItem, st = SP.setItem, rm = SP.removeItem, k0 = SP.key;
  var lenDesc = Object.getOwnPropertyDescriptor(SP, 'length');
  function rawKeys(store){ var out = [], n = lenDesc.get.call(store); for(var i = 0; i < n; i++){ out.push(k0.call(store, i)); } return out; }
  function mine(store){ return rawKeys(store).filter(function(k){ return k && k.indexOf(P) === 0; }).map(function(k){ return k.slice(P.length); }); }
  SP.getItem = function(k){ return g.call(this, P + k); };
  SP.setItem = function(k, v){ return st.call(this, P + k, v); };
  SP.removeItem = function(k){ return rm.call(this, P + k); };
  SP.key = function(i){ var a = mine(this); return i < a.length ? a[i] : null; };
  SP.clear = function(){ var self = this; mine(this).forEach(function(k){ rm.call(self, P + k); }); };
  Object.defineProperty(SP, 'length', { get: function(){ return mine(this).length; }, configurable: true });
  window.abLsKeys = function(){ return mine(window.localStorage); };
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آڑھت بک</title>
<meta name="theme-color" content="#7f1d1d">
<meta name="description" content="آڑھت بک — آڑھتی کا حساب: زمیندار، گاڑی، بکری، پرچی، خریدار کا کھاتہ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آڑھت بک">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face{font-family:'Noori'; src:url('fonts/JameelNooriNastaleeq-Regular.woff2') format('woff2'); font-display:swap;}
@font-face{font-family:'NooriKasheeda'; src:url('fonts/JameelNooriNastaleeq-Kasheeda.woff2') format('woff2'); font-display:swap;}
:root{
  --red:#b91c1c; --red2:#991b1b; --red3:#7f1d1d; --red4:#450a0a; --redL:#fee2e2; --redL2:#fecaca; --redL3:#fff5f5;
  --gold:#fbbf24; --ink:#1c1917; --muted:#78716c; --card:#ffffff; --good:#15803d; --bad:#b91c1c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{font-family:'Noori','Noto Nastaliq Urdu',serif; color:var(--ink); background:radial-gradient(circle at 20% 0%,#dc2626 0%,#991b1b 38%,#7f1d1d 70%,#450a0a 100%) fixed; direction:rtl; text-align:right; font-size:18px; line-height:1.9;}
.num,input[inputmode],input[type=date],.v{font-family:Tahoma,Arial,sans-serif !important;}
button{font:inherit; cursor:pointer;}
input,select,textarea{font:inherit;}

/* ---------- اوپر کی پٹی ---------- */
#topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px; padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top)); background:linear-gradient(180deg,#450a0a,#7f1d1d); color:#fff; box-shadow:0 3px 12px rgba(0,0,0,.35); border-bottom:3px solid var(--gold);}
#topbar .ttl{flex:1; min-width:0; font-family:'NooriKasheeda','Noori',serif; font-size:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.8;}
#topbar .ib{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:12px; width:44px; height:40px; font-size:20px; display:inline-flex; align-items:center; justify-content:center;}
#verBadge{background:rgba(0,0,0,.25); border:1px solid rgba(251,191,36,.6); color:#fde68a; border-radius:10px; padding:0 8px; font:12px/2 Tahoma,Arial,sans-serif; cursor:pointer; user-select:none;}

/* ---------- ڈھانچہ: فون پر دراز، کروم بک پر دائیں مستقل پٹی ---------- */
#layout{display:flex; min-height:calc(100vh - 56px);}
#side{position:fixed; top:0; bottom:0; right:0; width:270px; max-width:84vw; z-index:60; background:linear-gradient(180deg,#450a0a,#7f1d1d 60%,#991b1b); color:#fff; transform:translateX(105%); transition:transform .22s; overflow-y:auto; padding:12px 10px 30px; box-shadow:-6px 0 20px rgba(0,0,0,.4);}
#side.open{transform:none;}
#sideShade{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:55; display:none;}
#sideShade.open{display:block;}
#side .brand{font-family:'NooriKasheeda',serif; font-size:28px; text-align:center; color:#fde68a; margin:4px 0 10px;}
#side .nav{display:flex; align-items:center; gap:10px; width:100%; border:none; background:rgba(255,255,255,.08); color:#fff; border-radius:12px; padding:4px 12px; margin-bottom:6px; font-size:19px; text-align:right;}
#side .nav.on{background:#fff; color:var(--red3); box-shadow:0 3px 0 var(--gold);}
#side .nav .e{font-size:20px; width:26px; text-align:center;}
#main{flex:1; min-width:0; padding:10px 10px 90px;}
@media (min-width:900px){
  #side{position:sticky; top:56px; height:calc(100vh - 56px); transform:none; box-shadow:none; width:250px; flex:0 0 250px;}
  #sideShade,#menuBtn{display:none !important;}
  #main{padding:16px 22px 40px;}
}
.wrap{max-width:1280px; margin:0 auto;}

/* ---------- کارڈ، خانے، بٹن ---------- */
.card{background:var(--card); border-radius:16px; padding:12px; margin-bottom:12px; box-shadow:0 6px 18px rgba(0,0,0,.22); border-top:4px solid var(--red);}
.card h3{margin:0 0 6px; color:var(--red3); font-size:21px; line-height:1.9; font-weight:normal;}
.card.plain{border-top:none;}
.pageTitle{color:#fff; font-family:'NooriKasheeda','Noori',serif; font-size:30px; margin:2px 4px 8px; text-shadow:0 2px 6px rgba(0,0,0,.4); line-height:1.8; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.pageTitle .sp{flex:1;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
.f label{display:block; font-size:15px; color:#57534e; line-height:1.8;}
.f input,.f select,.f textarea{width:100%; border:1.6px solid #fca5a5; border-radius:11px; padding:6px 9px; font-size:18px; line-height:1.7; background:#fff; color:var(--ink); min-height:44px;}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #dc2626; border-color:#dc2626;}
.f input[inputmode],.f input[type=date]{direction:ltr; text-align:right;}
.btn{border:none; border-radius:12px; padding:6px 16px; font-size:19px; line-height:1.9; background:linear-gradient(180deg,#dc2626,#b91c1c); color:#fff; box-shadow:0 3px 0 #7f1d1d; min-height:44px;}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #7f1d1d;}
.btn.light{background:#fff1f2; color:var(--red3); box-shadow:0 3px 0 #fecaca; border:1.5px solid #fecaca;}
.btn.gray{background:#f5f5f4; color:#44403c; box-shadow:0 3px 0 #d6d3d1;}
.btn.gold{background:linear-gradient(180deg,#fcd34d,#f59e0b); color:#451a03; box-shadow:0 3px 0 #b45309;}
.btn.sm{font-size:15px; padding:2px 10px; min-height:36px;}
.btn.wide{width:100%;}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.muted{color:var(--muted); font-size:15px;}
.warn{background:#fef2f2; border:1.5px solid #ef4444; color:#991b1b; border-radius:10px; padding:6px 10px; margin:6px 0;}
.ok{background:#f0fdf4; border:1.5px solid #22c55e; color:#166534; border-radius:10px; padding:6px 10px; margin:6px 0;}

/* ---------- ہوم ---------- */
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:12px;}
.stat{background:rgba(255,255,255,.96); border-radius:14px; padding:6px 10px; box-shadow:0 4px 12px rgba(0,0,0,.2); border-right:5px solid var(--red);}
.stat .l{font-size:15px; color:#57534e;}
.stat .n{font-family:Tahoma,Arial,sans-serif; font-size:21px; color:var(--red3); direction:ltr; text-align:right; line-height:1.6;}
.stat.g{border-right-color:#15803d;} .stat.g .n{color:#166534;}
.stat.y{border-right-color:#f59e0b;} .stat.y .n{color:#92400e;}
.tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
.tile{background:#fff; border:none; border-radius:18px; padding:12px 4px 6px; box-shadow:0 5px 14px rgba(0,0,0,.25); display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--red3); font-size:17px; line-height:1.8;}
.tile .e{font-size:34px; width:62px; height:62px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#fee2e2,#fecaca); box-shadow:inset 0 -3px 0 rgba(127,29,29,.15);}
.tile.big{grid-column:span 3; flex-direction:row; justify-content:center; gap:12px; font-size:24px; background:linear-gradient(180deg,#fcd34d,#f59e0b); color:#451a03;}
.tile.big .e{background:rgba(255,255,255,.5); width:54px; height:54px;}
@media (min-width:700px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr));}
  .tile.big{grid-column:span 5;}
  .grid2.wideable{grid-template-columns:repeat(4,minmax(0,1fr));}
}

/* ---------- جدول اور فہرستیں ---------- */
.t{width:100%; border-collapse:collapse; font-size:17px;}
.t td,.t th{padding:3px 6px; border-bottom:1px solid #fee2e2; line-height:1.8; vertical-align:middle;}
.t th{color:var(--red3); font-weight:normal; background:#fff5f5;}
.t td.v,.t th.v{text-align:left; direction:ltr; font-size:15px; white-space:nowrap;}
.t tr.tot td{font-size:19px; color:var(--red3); border-top:2px solid var(--red); border-bottom:none;}
.t tr.net td{font-size:21px; background:var(--red); color:#fff;}
.t .tag{font-size:12px; border-radius:8px; padding:0 6px; margin-right:4px; font-family:'Noori',serif;}
.t .tag.in{background:#dcfce7; color:#166534;} .t .tag.out{background:#f5f5f4; color:#57534e;}
.tblWrap{overflow-x:auto;}
.list .it{display:flex; justify-content:space-between; gap:8px; align-items:center; border-bottom:1px solid #fee2e2; padding:6px 4px; cursor:pointer; border-radius:8px;}
.list .it:hover{background:#fff5f5;}
.list .it .a{font-family:Tahoma,Arial,sans-serif; direction:ltr; white-space:nowrap; font-size:16px;}
.amt-in{color:#166534;} .amt-out{color:#b91c1c;}

/* ---------- پرچی ---------- */
.line{border:1.6px dashed #fca5a5; border-radius:12px; padding:10px 8px 6px; margin:12px 0 8px; background:#fffafa; position:relative;}
.line .no{position:absolute; top:-12px; right:10px; background:var(--red); color:#fff; border-radius:10px; padding:0 9px; font-size:13px; line-height:1.8;}
.lineGrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px;}
.lineAmt{font-size:16px; color:var(--red3);}
.parchiWrap{display:block;}
@media (min-width:1000px){
  .parchiWrap{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:14px; align-items:start;}
  .parchiWrap .sticky{position:sticky; top:66px;}
  .lineGrid{grid-template-columns:2fr 1fr 1fr 1fr 1fr 2fr;}
}
.chg{display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center; border-bottom:1px solid #fee2e2; padding:6px 0;}
.chg .n{font-size:18px;} .chg .d{font-size:14px; color:var(--muted);}
.chg.off .n{color:#a8a29e; text-decoration:line-through;}
.seg{display:flex; background:#fff1f2; border-radius:12px; padding:3px; gap:3px; margin-bottom:10px;}
.seg button{flex:1; border:none; background:transparent; color:var(--red3); border-radius:10px; padding:4px 6px; font-size:18px; min-height:42px;}
.seg button.on{background:var(--red); color:#fff;}

/* ---------- پیغام اور اپڈیٹ کارڈ ---------- */
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(30px); background:#450a0a; color:#fff; padding:6px 18px; border-radius:22px; font-size:18px; line-height:1.9; opacity:0; transition:.25s; z-index:9999; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.4); border:1px solid var(--gold); max-width:92vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#modal{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9000; display:none; align-items:center; justify-content:center; padding:16px;}
#modal.open{display:flex;}
#modal .box{background:#fff; border-radius:18px; max-width:440px; width:100%; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); border-top:6px solid var(--red); text-align:center;}
#modal .box h3{margin:0 0 6px; color:var(--red3); font-family:'NooriKasheeda','Noori',serif; font-size:26px; font-weight:normal;}

/* ---------- رجسٹریشن / تالا ---------- */
.gate{max-width:480px; margin:24px auto; }
.gate .logo{display:block; width:96px; height:96px; border-radius:24px; margin:0 auto 6px; box-shadow:0 6px 16px rgba(0,0,0,.4);}
.gate h1{text-align:center; color:#fff; font-family:'NooriKasheeda',serif; font-size:42px; margin:0; font-weight:normal; text-shadow:0 3px 8px rgba(0,0,0,.4);}
.gate .sub{text-align:center; color:#fecaca; margin-bottom:10px;}
.pinDots{display:flex; justify-content:center; gap:10px; margin:10px 0; direction:ltr;}
.pinDots i{width:16px; height:16px; border-radius:50%; border:2px solid var(--red); display:inline-block;}
.pinDots i.f{background:var(--red);}
.pinPad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; direction:ltr; max-width:300px; margin:0 auto;}
.pinPad button{font:24px Tahoma,Arial,sans-serif; border:none; border-radius:14px; background:#fff1f2; color:var(--red3); min-height:56px; box-shadow:0 3px 0 #fecaca;}

@media print{ body{background:#fff;} #topbar,#side,#sideShade{display:none !important;} }
</style>
</head>
<body>
<div id="topbar">
  <button class="ib" id="menuBtn" onclick="App.menu(true)" aria-label="مینو">☰</button>
  <div class="ttl" id="ttl">آڑھت بک</div>
  <span id="verBadge" onclick="App.verTap()"></span>
</div>
<div id="sideShade" onclick="App.menu(false)"></div>
<div id="layout">
  <nav id="side"></nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
